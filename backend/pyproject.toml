[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "open-ccai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "cryptography>=44",
  "pwdlib[argon2]>=0.2,<1", "PyJWT>=2.10,<3", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pypdf>=5,<7", "pgvector>=0.3,<1",
  "celery>=5.4,<6", "litellm>=1.80,<2"
]
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.setuptools.package-data]
app = ["static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
